    <!-- Base-path resolver for GitHub Pages & subpath hosting -->
    <script>
      (function() {
        const path = window.location.pathname;
        const base = path.endsWith('/') ? path : path.substring(0, path.lastIndexOf('/') + 1);
        if (base && base !== '/') {
          const origFetch = window.fetch;
          window.fetch = function(input, init) {
            if (typeof input === 'string' && input.startsWith('/assets/')) {
              input = base + input.slice(1);
            }
            return origFetch.call(this, input, init);
          };

          const OrigWorker = window.Worker;
          window.Worker = function(scriptURL, options) {
            if (typeof scriptURL === 'string' && scriptURL.startsWith('/assets/')) {
              scriptURL = base + scriptURL.slice(1);
            } else if (scriptURL instanceof URL && scriptURL.pathname.startsWith('/assets/')) {
              scriptURL = new URL(base + scriptURL.pathname.slice(1), window.location.origin);
            }
            return new OrigWorker(scriptURL, options);
          };

          if (window.AudioContext && window.AudioWorklet && AudioWorklet.prototype.addModule) {
            const origAddModule = AudioWorklet.prototype.addModule;
            AudioWorklet.prototype.addModule = function(moduleURL, options) {
              if (typeof moduleURL === 'string' && moduleURL.startsWith('/assets/')) {
                moduleURL = base + moduleURL.slice(1);
              }
              return origAddModule.call(this, moduleURL, options);
            };
          }
        }
      })();
    </script>
